<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}TaskFlow{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#5b5bd6;--brand2:#7c3aed;--ink:#172033;--muted:#667085;--bg:#f6f7fb;--line:#e7eaf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.navbar{background:linear-gradient(135deg,#171a2b,#24284a)!important;border-bottom:1px solid rgba(255,255,255,.08);padding:.85rem 0}
.brand{display:flex;align-items:center;gap:.65rem;color:#fff!important;font-weight:800;letter-spacing:-.03em;font-size:1.2rem;text-decoration:none}
.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 20px #5b5bd655}
.logo svg{width:22px;height:22px}.nav-link,.nav-user{color:#dfe2ef!important;font-size:.88rem}.nav-link:hover{color:#fff!important}
.btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand2));border:0;color:#fff;font-weight:600;box-shadow:0 7px 18px #5b5bd633}.btn-brand:hover{color:#fff;filter:brightness(.96)}
.btn{border-radius:9px;font-weight:600}.card{border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(16,24,40,.06);background:#fff}
.page-title{font-weight:800;letter-spacing:-.04em}.subtitle{color:var(--muted)}
.stat-card{padding:1.15rem 1.2rem;height:100%;position:relative;overflow:hidden}.stat-label{font-size:.78rem;color:var(--muted);font-weight:600}.stat{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;margin-top:.15rem}.stat-icon{position:absolute;right:15px;top:15px;width:38px;height:38px;border-radius:11px;background:#f0f0ff;color:var(--brand);display:grid;place-items:center;font-weight:800}
.task-card{border-left:4px solid #98a2b3}.overdue{border-left-color:#ef4444}.badge{font-weight:600;padding:.42em .65em;border-radius:7px}
.section-title{font-size:1.05rem;font-weight:750}.form-control,.form-select{border-radius:9px;border-color:#dfe3ea;padding:.7rem .8rem}.form-control:focus,.form-select:focus{border-color:#8b8be7;box-shadow:0 0 0 .2rem #5b5bd61a}
form p{margin-bottom:1rem}form label{font-weight:600;font-size:.88rem;margin-bottom:.4rem}
.auth-wrap{min-height:70vh;display:flex;align-items:center}.auth-card{max-width:460px;width:100%;margin:auto}.auth-logo{margin:0 auto 1rem}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:1rem 0}
footer{color:#98a2b3;font-size:.78rem;padding:2rem 0}
@media(max-width:767px){.navbar .btn{font-size:.78rem}.nav-user{display:none}.stat{font-size:1.55rem}}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="brand" href="{% url 'dashboard' %}">
<span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.2 17 19 7"/><path d="M4 4h16v16H4z" opacity=".25"/></svg></span>
TaskFlow
</a>
<div class="ms-auto d-flex gap-2 align-items-center">
{% if user.is_authenticated %}
<a class="btn btn-sm btn-outline-light" href="{% url 'project_list' %}">Projects</a>
<a class="btn btn-sm btn-brand" href="{% url 'task_create' %}">+ New Task</a>
<span class="nav-user ms-2">{{ user.username }}</span>
<form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout</button></form>
{% endif %}
</div>
</div>
</nav>
<main class="container py-4 py-lg-5">
{% for message in messages %}<div class="alert alert-success border-0 shadow-sm">{{message}}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<footer><div class="container text-center">TaskFlow · Simple, focused project management</div></footer>
</body></html>
